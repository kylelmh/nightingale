name: "Build Nightingale Linux DEB"

on:
  push:
    branches:
      - main
      - release
      - feat/add-aarch-cuda
  workflow_dispatch:

# This workflow will build Nightingale Linux DEB packages for x86_64 and aarch64

jobs:
  build-linux-deb:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds - DEB packages only
          - platform: "ubuntu-24.04"
            args: "--target x86_64-unknown-linux-gnu"
            rust-target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04-arm"
            args: "--target aarch64-unknown-linux-gnu"
            rust-target: "aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf \
            xdg-utils

      - name: Install Linux cross-compilation dependencies (aarch64)
        if: matrix.rust-target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: client

      - name: Check Tauri configuration
        run: |
          echo "Tauri configuration:"
          cat src-tauri/tauri.conf.json | grep -A 10 -B 5 "bundle" || echo "Bundle config not found"
          echo "Available Tauri commands:"
          pnpm tauri --help || echo "Tauri CLI not available"
        working-directory: client

      - name: Build DEB package
        run: |
          echo "Building for target: ${{ matrix.rust-target }}"
          echo "Build args: ${{ matrix.args }}"
          cargo desktop build ${{ matrix.args }}

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: nightingale-deb-${{ matrix.rust-target }}
          path: |
            target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
          retention-days: 90
          if-no-files-found: warn
